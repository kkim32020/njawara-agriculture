<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Partners - Njawara Agriculture Training Center</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      line-height: 1.6;
    }

    header {
      background-color: #2f6b2f;
      color: white;
      padding: 20px;
    }

    nav a {
      margin-right: 15px;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* ADD THIS */
    .spacer {
      height: 600px;
    }

    footer {
      background-color: #d4edda;
      padding: 40px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 30px;
    }

    .natc-logo {
      width: 45%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .natc-logo img {
      max-width: 300px;
      width: 100%;
    }

    .divider {
      width: 6px;
      height: 340px;
      background-color: #5a8f5a;
      border-radius: 20px;
    }

    .contact-card {
      width: 45%;
      display: flex;
      justify-content: center;
    }

    .contact-card-inner {
      background-color: #a8d5a2;
      padding: 30px;
      border-radius: 12px;
      max-width: 400px;
      width: 100%;
    }

    @media (max-width: 768px) {
      footer { flex-direction: column; }
      .divider { display: none; }
      .natc-logo, .contact-card { width: 100%; }
    }
  </style>
</head>

<body>

<header>
  <nav>
    <a href="index.html">Home</a>
    <a href="Partners.html">Partners</a>
    <a href="programs.html">Programs</a>
    <a href="partners.html">Partners</a>
    <a href="#contact" class="contact-link">Contact</a>
  </nav>
</header>

<main>
  <h1>Partners</h1>
  <p>Content coming soon.</p>

  <!-- ADD THIS -->
  <div class="spacer"></div>
</main>

<footer id="contact">
  <div class="natc-logo">
    <img src="natc-logo.jpeg">
  </div>

  <div class="divider"></div>

  <div class="contact-card">
    <div class="contact-card-inner">
      <h2>Contact Us</h2>
      <p>
        <strong>Email:</strong> njawaraatc@gmail.com<br>
        <strong>Phone:</strong> +220 123 4567<br>
        <strong>Address:</strong> Njawara, North Bank Region, The Gambia
      </p>
    </div>
  </div>
</footer>

<script>
document.querySelectorAll('.contact-link').forEach(link => {
  link.addEventListener('click', function(e) {
    e.preventDefault();
    document.getElementById('contact').scrollIntoView({
      behavior: 'smooth'
    });
  });
});
</script>

</body>
</html>
